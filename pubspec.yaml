name: hymnus
description: "An easy way to access a repository of Christian songs and chords."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  diacritic: ^0.1.5
  htmltopdfwidgets: ^1.0.3
  path_provider: ^2.1.3
  share_extend: ^2.0.0
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  choice: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/icon-500x500.png"
    background_color: "#0D47A1"
    theme_color: "#0D47A1"
  image_path: "assets/images/icon-500x500.png"
  image_path_ios: "assets/images/icon-500x500-square.png"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/images/icon-foreground-500x500.png"
